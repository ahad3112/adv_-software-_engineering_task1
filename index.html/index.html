<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Task – CS352 Team Project</title>
  <style>
    :root {
      --navy: #12254a;
      --navy-deep: #0a1730;
      --blue: #2b4a86;
      --gold: #c29a43;
      --gold-soft: #f4ead2;
      --paper: #f3f4f7;
      --card: #ffffff;
      --ink: #1b2233;
      --muted: #627086;
      --line: #e1e5ec;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .wrap { max-width: 860px; margin: 0 auto; padding: 0 1.25rem; }

    /* ---------- Hero ---------- */
    header {
      color: #fff;
      padding: 4rem 0 6.5rem;
      background:
        radial-gradient(circle at 85% 0%, rgba(194,154,67,.28), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px),
        linear-gradient(160deg, var(--navy-deep), var(--navy) 55%, var(--blue));
      border-bottom: 5px solid var(--gold);
      animation: rise .7s ease-out both;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .6rem .9rem;
      margin-bottom: 1.25rem;
      font-size: .95rem;
      color: #cfd8ea;
    }

    .chip {
      background: var(--gold);
      color: var(--navy-deep);
      font-weight: 700;
      padding: .2rem .75rem;
      border-radius: 999px;
      letter-spacing: .02em;
    }

    h1 {
      margin: 0 0 .6rem;
      font-family: var(--serif);
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      max-width: 34rem;
      color: #cfd8ea;
      font-size: 1.05rem;
    }

    /* ---------- Team card ---------- */
    main { margin-top: -4rem; padding-bottom: 3rem; }

    .card {
      background: var(--card);
      border-radius: 10px;
      border-top: 4px solid var(--gold);
      box-shadow: 0 18px 40px -18px rgba(10,23,48,.35), 0 2px 6px rgba(10,23,48,.06);
      padding: 1.75rem;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }

    h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--navy);
    }

    .count { color: var(--muted); font-size: .95rem; }

    .table-scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th, td { text-align: left; padding: 1rem 1.1rem; }

    thead th {
      background: var(--navy);
      color: #fff;
      font-weight: 600;
      font-size: .95rem;
    }
    thead th:first-child { border-radius: 8px 0 0 8px; }
    thead th:last-child  { border-radius: 0 8px 8px 0; }

    tbody td { border-bottom: 1px solid var(--line); }
    tbody tr { transition: background .2s; }
    tbody tr:hover { background: var(--gold-soft); }
    tbody tr:last-child td { border-bottom: 0; }

    .person { display: flex; align-items: center; gap: .9rem; font-weight: 600; }

    .avatar {
      flex: none;
      width: 2.6rem; height: 2.6rem;
      display: grid; place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--blue), var(--navy));
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      box-shadow: 0 0 0 3px var(--gold-soft);
    }

    .id {
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
      color: var(--navy);
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 0 1.25rem 2.5rem;
      font-size: .9rem;
      color: var(--muted);
    }
    footer::before {
      content: "";
      display: block;
      width: 3rem; height: 3px;
      margin: 0 auto 1rem;
      background: var(--gold);
      border-radius: 2px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { header { animation: none; } }

    /* ---------- Mobile ---------- */
    @media (max-width: 560px) {
      header { padding: 2.5rem 0 5.5rem; }
      .card { padding: 1.1rem; }

      thead {
        position: absolute; width: 1px; height: 1px;
        overflow: hidden; clip: rect(0 0 0 0);
      }

      table, tbody, tr, td { display: block; width: 100%; }

      tr {
        border: 1px solid var(--line);
        border-left: 4px solid var(--gold);
        border-radius: 8px;
        margin-bottom: .8rem;
        overflow: hidden;
      }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: .75rem 1rem;
      }
      tbody td { border-bottom: 1px solid var(--line); }
      td:last-child { border-bottom: 0; }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: .85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <div class="meta">
        <span class="chip">CS352</span>
        <span>Advanced Software Engineering</span>
        <span>Cairo University</span>
      </div>
      <h1>Lab Task</h1>
      <p class="subtitle">Team project submission prepared by the students listed below.</p>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card" aria-labelledby="team-heading">
        <div class="card-head">
          <h2 id="team-heading">Team Members</h2>
          <span class="count">3 students</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Student ID</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-label="Name"><span class="person"><span class="avatar" aria-hidden="true">AA</span>Ahed Adel</span></td>
                <td data-label="Student ID"><span class="id">20243037</span></td>
              </tr>
              <tr>
                <td data-label="Name"><span class="person"><span class="avatar" aria-hidden="true">WS</span>Waddahaalmahya Sami</span></td>
                <td data-label="Student ID"><span class="id">20243057</span></td>
              </tr>
              <tr>
                <td data-label="Name"><span class="person"><span class="avatar" aria-hidden="true">ME</span>Malaz Elfadil</span></td>
                <td data-label="Student ID"><span class="id">20243035</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer>
    Submitted to Eng. Ahmed Ehab · October 2026
  </footer>

</body>
</html>
